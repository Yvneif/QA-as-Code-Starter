name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Playwright – ${{ matrix.browser }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers with system dependencies
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run tests (${{ matrix.browser }})
        run: npx playwright test --project=${{ matrix.browser }}
        env:
          CI: true
          # Demo credentials are public by design; real secrets would come from
          # GitHub Actions secrets with no fallback.
          DEMO_USERNAME: ${{ secrets.DEMO_USERNAME || 'standard_user' }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD || 'secret_sauce' }}
          DEMO_LOCKED_USERNAME: ${{ secrets.DEMO_LOCKED_USERNAME || 'locked_out_user' }}
          DEMO_LOCKED_PASSWORD: ${{ secrets.DEMO_LOCKED_PASSWORD || 'secret_sauce' }}

      # FR3: the HTML report is published as a workflow artifact after every run.
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 14

      # FR4: traces, screenshots, and videos for failed tests.
      - name: Upload failure artifacts
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-failure-artifacts-${{ matrix.browser }}
          path: test-results/
          retention-days: 14
